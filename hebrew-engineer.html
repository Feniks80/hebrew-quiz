const h=(tag,cls,inner,attrs)=>{
  const el=document.createElement(tag);
  if(cls)el.className=cls;
  if(typeof inner==='string')el.innerHTML=inner;
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='onclick')el.addEventListener('click',v);
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else el.setAttribute(k,v);
  });
  return el;
};

function pickV(){if(!('speechSynthesis' in window))return;const a=speechSynthesis.getVoices()||[];heVoice=a.find(v=>/^he[-_]?IL/i.test(v.lang))||a.find(v=>/^iw[-_]?IL/i.test(v.lang))||a.find(v=>/^(he|iw)/i.test(v.lang))||null}
if('speechSynthesis' in window){pickV();speechSynthesis.onvoiceschanged=pickV;setTimeout(pickV,300);setTimeout(pickV,1500)}
function say(t,slow){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel()}catch(e){}setTimeout(()=>{pickV();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=slow?0.55:0.85;u.pitch=1;u.volume=1;try{speechSynthesis.speak(u)}catch(e){}},50)}

      const done=idxs.filter(i=>prog[i]!=null).length;
      const avg=done>0?Math.round(idxs.filter(i=>prog[i]!=null).reduce((s,i)=>s+prog[i],0)/done):0;

      if(!GF&&cat.g&&cat.g!==lastG){lastG=cat.g;app.appendChild(h('div','',cat.g,{style:{fontSize:'12px',fontWeight:'800',color:'#0f172a',textTransform:'uppercase',letterSpacing:'1px',margin:'18px 0 8px',borderTop:'2px solid #e2e8f0',paddingTop:'12px'}}))}

      const hdr=h('div','cat-hdr','');
      hdr.innerHTML='<span style="font-size:18px;font-weight:700;color:#1e293b">'+cat.k+'</span>'
        +(done>0?'<span style="font-size:12px;color:#94a3b8">'+done+'/'+idxs.length+' ср.'+avg+'%</span>':'');
      app.appendChild(hdr);

      const btns=h('div','cat-btns','');
      idxs.forEach(i=>{
        const p=prog[i];
        const bc=p==null?'#cbd5e1':p>=80?'#22c55e':p>=50?'#eab308':'#ef4444';
        const n=Q[i][1].length;
        const label=idxs.length===1?'1':''+(i-cat.r[0]+1);
        const b=h('div','qbtn','<div>'+label+'</div><div style="font-size:9px;color:#94a3b8">'+n+'</div>'
          +(p!=null?'<div style="font-size:9px;font-weight:700;color:'+bc+'">'+p+'%</div>':''),
          {onclick:()=>startQuiz(i)});
        b.style.border='2px solid '+bc;
        b.style.background=p!=null?(bc+'18'):'#fff';
        b.style.color=p!=null?bc:'#64748b';
        btns.appendChild(b);
      });
      app.appendChild(btns);
    });

    // Reset
    if(Object.keys(prog).length>0){
      app.appendChild(h('button','btn btn-s','Сбросить прогресс',{onclick:()=>{prog={};saveProg();render('menu')},style:{marginTop:'8px',fontSize:'13px'}}));
    }
    return;
  }

  if(page==='quiz'&&qs.length>0){
    const q=qs[ci];
    const cat=curQi<0?{k:'Микс',c:'#2563eb'}:getCat(curQi);
    const prompt=q.heRu?q.item[1]:q.item[0];
    const af=q.heRu?0:1;
    const pct=(ci+1)/qs.length*100;
    const qName=errMode?'Работа над ошибками':curQi<0?'Случайный микс':Q[curQi][0];

    app.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:4px">'
      +'<span style="font-size:12px;color:'+cat.c+';font-weight:600">'+qName+'</span>'
      +'<span style="font-size:12px;color:#94a3b8">'+(ci+1)+'/'+qs.length+'</span></div>';
    
    const bar=h('div','bar','');
    const fill=h('div','bar-fill','');
    fill.style.width=pct+'%';fill.style.background=cat.c;
    bar.appendChild(fill);app.appendChild(bar);

    const card=h('div','card','');
    card.style.background=cat.c+'0a';card.style.border='1px solid '+cat.c+'22';
    card.innerHTML='<div style="font-size:11px;color:#94a3b8;margin-bottom:4px">'+(q.heRu?'Переведите с иврита':'Переведите на иврит')+'</div>'
      +'<div style="font-size:'+(q.heRu?26:17)+'px;font-weight:600;direction:'+(q.heRu?'rtl':'ltr')+';word-break:break-word">'+prompt+'</div>';
    const row=h('div','',null,{style:{marginTop:'10px',display:'flex',justifyContent:'center',alignItems:'center',gap:'6px'}});
    row.appendChild(spkBtn(q.item[1]));
    card.appendChild(row);
    app.appendChild(card);
    if(q.heRu&&!showed)setTimeout(()=>say(q.item[1]),200);

    q.opts.forEach((opt,i)=>{
      const isOk=opt[af]===q.item[af];
      const isSel=pick&&pick[af]===opt[af];
      const o=h('div','opt',opt[af],{onclick:()=>{
        if(showed)return;
        pick=opt;showed=true;
        if(isOk)resOk.push(q.item);else resBad.push(q.item);
        render('quiz');
      }});
      o.style.fontSize=(q.heRu?'14':'18')+'px';
      o.style.direction=q.heRu?'ltr':'rtl';
      if(showed){
        if(isOk){o.style.background='#dcfce7';o.style.borderColor='#22c55e';o.style.color='#166534';o.style.fontWeight='600'}
        else if(isSel){o.style.background='#fee2e2';o.style.borderColor='#ef4444';o.style.color='#991b1b'}
        else{o.style.background='#f8fafc';o.style.color='#94a3b8'}
        o.style.cursor='default';
      }
      app.appendChild(o);
    });

    if(showed){
      const info=h('div','info','<span style="direction:rtl;display:inline"><b>'+q.item[1]+'</b></span> = '+q.item[2]+' = '+q.item[0]);
      info.appendChild(spkBtn(q.item[1]));
      app.appendChild(info);
      setTimeout(()=>say(q.item[1]),120);
      const nb=h('button','btn','',{onclick:()=>{
        if(ci+1>=qs.length){
          if(!errMode&&curQi>=0){prog[curQi]=Math.round(resOk.length/qs.length*100);saveProg()}
          render('result');return;
        }
        ci++;pick=null;showed=false;render('quiz');
      }});
      nb.style.background=cat.c;nb.style.color='#fff';
      nb.textContent=ci+1>=qs.length?'Результаты':'Дальше';
      app.appendChild(nb);
    }
    const exit=h('button','btn btn-s','← Закончить и в меню',{onclick:()=>render('menu'),style:{marginTop:'10px',fontSize:'13px'}});
    app.appendChild(exit);
    return;
  }

  if(page==='result'){
    const total=resOk.length+resBad.length;
    const pct=total>0?Math.round(resOk.length/total*100):0;
    const cat=curQi<0?{c:'#2563eb'}:getCat(curQi);
    const qName=errMode?'Работа над ошибками':curQi<0?'Случайный микс':Q[curQi][0];

    app.innerHTML='<div style="text-align:center;margin-bottom:16px">'
      +'<div style="font-size:42px;font-weight:800;color:'+(pct>=70?'#16a34a':pct>=40?'#d97706':'#dc2626')+'">'+pct+'%</div>'
      +'<div style="font-size:14px;color:#64748b">'+resOk.length+' / '+total+' правильно</div>'
      +'<div style="font-size:13px;color:#94a3b8;margin-top:2px">'+qName+'</div></div>';

    if(resBad.length>0){
      const eb=h('div','','<div style="font-size:14px;font-weight:600;color:#dc2626;margin-bottom:8px">Ошибки ('+resBad.length+')</div>');
      resBad.forEach(item=>{
        const c=h('div','err-card','<div style="display:flex;justify-content:space-between;align-items:center">'
          +'<span style="font-weight:600;color:#991b1b">'+item[0]+'</span>'
          +'<span style="direction:rtl;font-size:16px;font-weight:600">'+item[1]+'</span></div>'
          +'<div style="color:#b91c1c;margin-top:2px">'+item[2]+'</div>');
        eb.appendChild(c);
      });
      eb.style.marginBottom='16px';
      app.appendChild(eb);
    }

    if(resOk.length>0){
      const det=h('details','','');
      det.innerHTML='<summary style="font-size:14px;font-weight:600;color:#16a34a;margin-bottom:6px">Правильные ('+resOk.length+')</summary>';
      resOk.forEach(item=>{
        const r=h('div','',item[0]+' = <span style="direction:rtl">'+item[1]+'</span> = '+item[2],
          {style:{padding:'6px',fontSize:'12px',color:'#64748b',borderBottom:'1px solid #f1f5f9'}});
        det.appendChild(r);
      });
      det.style.marginBottom='16px';
      app.appendChild(det);
    }

    const btns=h('div','',null,{style:{display:'flex',gap:'8px',flexWrap:'wrap'}});
    btns.appendChild(h('button','btn btn-s','Меню',{onclick:()=>render('menu'),style:{flex:'1',minWidth:'100px'}}));
    if(resBad.length>0){
      btns.appendChild(h('button','btn btn-r','Ошибки ('+resBad.length+')',{onclick:()=>{startErrors(resBad)},style:{flex:'1',minWidth:'100px'}}));
    }
    const retry=h('button','btn','',{onclick:()=>{curQi<0?startRandom():startQuiz(curQi)},style:{flex:'1',minWidth:'100px'}});
    retry.style.background=cat.c;retry.style.color='#fff';
    retry.textContent=curQi<0?'Новый микс':'Заново';
    btns.appendChild(retry);
    app.appendChild(btns);
  }
}

function buildQs(items){
  return sh(items.map(item=>{
    const heRu=dir==='he'||(dir==='mix'&&Math.random()>0.5);
    return{item,heRu,opts:mkO(item,heRu?0:1)};
  }));
}

function startQuiz(idx){
  curQi=idx;qs=buildQs(Q[idx][1]);ci=0;pick=null;showed=false;
  resOk=[];resBad=[];errMode=false;render('quiz');
}

function startRandom(){
  curQi=-1;qs=buildQs(sh(pool).slice(0,rndSize));ci=0;pick=null;showed=false;
  resOk=[];resBad=[];errMode=false;render('quiz');
}

function startErrors(items){
  qs=buildQs(items);ci=0;pick=null;showed=false;
  resOk=[];resBad=[];errMode=true;render('quiz');
}

render('menu');
</script>
</body>
</html>
