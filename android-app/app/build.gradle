plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shimondonen.hebrewquiz'
    compileSdk 34

    defaultConfig {
        applicationId "com.shimondonen.hebrewquiz"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // For sideloading we sign with the debug keystore in CI.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
