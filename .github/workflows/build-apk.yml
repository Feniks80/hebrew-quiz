name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Decode signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::KS_B64 secret not set — building debug-signed APK for compile check only, no release"
          fi

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew --no-daemon assembleRelease -Pvc=$((1000 + ${{ github.run_number }}))

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk hebrew-quiz-$((1000 + ${{ github.run_number }})).apk

      - name: Print signing certificate
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs hebrew-quiz-*.apk | grep -E "SHA-256|DN"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-quiz-apk
          path: android-app/hebrew-quiz-*.apk

      - name: Publish to a GitHub Release
        if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Hebrew Quiz APK build #${{ github.run_number }}"
          body: |
            Android APK для **Учим иврит**.
            Построено GitHub Actions из коммита `${{ github.sha }}`.

            Новый адрес: https://feniks80.github.io/hebrew-quiz/

            **Установка:**
            1. В старом приложении на главной нажмите «💾 Получить код
               прогресса» и сохраните код.
            2. Удалите старое приложение «Иврит».
            3. Установите этот APK (разрешите установку из неизвестных
               источников).
            4. На главной нажмите «Восстановить из кода» и вставьте код.

            Следующие версии будут ставиться поверх, без удаления.

            © Shimon Donen, 2026.
          files: android-app/hebrew-quiz-*.apk
          fail_on_unmatched_files: true
