name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK (signed with the debug keystore)
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk hebrew-quiz-${{ github.run_number }}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-quiz-apk
          path: android-app/hebrew-quiz-*.apk

      - name: Publish to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Hebrew Quiz APK build #${{ github.run_number }}"
          body: |
            Android APK для **Учим иврит**.
            Построено GitHub Actions из коммита `${{ github.sha }}`.

            **Установка:**
            1. На телефоне или планшете включи «Установка из неизвестных
               источников» (Settings → Security / Apps).
            2. Скачай APK и открой — Android попросит подтвердить установку.
            3. На главном экране появится иконка «Иврит».

            Внутри — WebView, открывающий PWA с raw.githack.com. Громкость —
            «медиа». Голос иврита нужно установить системно, инструкция есть
            в самом приложении.

            © Shimon Donen, 2026.
          files: android-app/hebrew-quiz-*.apk
          fail_on_unmatched_files: true
