<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2">
<title>Иврит — выбор темы</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f8fafc;color:#1e293b}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:20px;line-height:1.4;padding:16px;min-height:100vh;-webkit-text-size-adjust:100%}
  a{text-decoration:none;color:inherit}
  .w{max-width:560px;margin:0 auto}

  h1{font-size:32px;font-weight:800;margin-bottom:4px;text-align:center}
  .sub{text-align:center;color:#475569;font-size:18px;margin-bottom:26px}

  .group-title{font-size:15px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin:24px 0 10px 4px}
  .group-title:first-of-type{margin-top:8px}

  /* simple single-link deck row */
  .deck{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:2px solid #cbd5e1;border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer}
  .deck:active{background:#eef2ff}
  .deck .ico{font-size:40px;line-height:1;flex-shrink:0;width:48px;text-align:center}
  .deck .body{flex:1;min-width:0}
  .deck .t{font-size:22px;font-weight:700;color:#1e293b}
  .deck .d{font-size:16px;color:#475569;margin-top:2px}
  .deck .arrow{font-size:28px;color:#94a3b8;flex-shrink:0}

  /* topic card with two actions (A2 cards + B2 test) */
  .topic{background:#fff;border:2px solid #cbd5e1;border-radius:16px;padding:16px 16px 14px;margin-bottom:12px}
  .topic .head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .topic .ico{font-size:38px;line-height:1;width:46px;text-align:center;flex-shrink:0}
  .topic .t{font-size:21px;font-weight:700}
  .topic .d{font-size:15px;color:#475569;margin-top:2px}
  .topic .acts{display:flex;gap:8px}
  .topic .act{flex:1;text-align:center;padding:12px 6px;border-radius:10px;font-size:16px;font-weight:600;border:2px solid #cbd5e1}
  .topic .act.cards{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
  .topic .act.cards:active{background:#dbeafe}
  .topic .act.test{background:#faf5ff;border-color:#e9d5ff;color:#7c3aed}
  .topic .act.test:active{background:#ede9fe}

  .foot{margin-top:28px;text-align:center;font-size:13px;color:#94a3b8;line-height:1.6}
  .foot a{color:#94a3b8;text-decoration:underline}
  .install-btn{display:none;width:100%;margin:0 0 20px;padding:16px;border:2px solid #2563eb;background:#2563eb;color:#fff;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer}
  .install-btn:active{background:#1d4ed8}

  /* voice check panel */
  #voicecheck{margin-bottom:20px}
  .vc-ok{background:#fff;border:2px solid #bbf7d0;border-radius:16px;padding:14px 16px;font-size:15px;color:#166534}
  .vc-ok .line{margin-bottom:4px}
  .vc-warn{background:#fff7ed;border:2px solid #fdba74;border-radius:16px;padding:18px 16px}
  .vc-warn .msg{font-size:19px;font-weight:700;color:#9a3412;margin-bottom:12px;line-height:1.4}
  .vc-warn .steps{font-size:15px;color:#7c2d12;line-height:1.7;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .vc-btn{display:inline-block;padding:12px 18px;border-radius:10px;font-size:16px;font-weight:700;border:2px solid #2563eb;background:#2563eb;color:#fff;cursor:pointer;margin:0 8px 8px 0}
  .vc-btn:active{background:#1d4ed8}
  .vc-btn.secondary{background:#fff;color:#2563eb}
  .vc-btn.secondary:active{background:#eff6ff}

  /* progress save/restore card */
  #progresscard{background:#fff;border:2px solid #cbd5e1;border-radius:16px;padding:18px 16px;margin-bottom:12px}
  #progresscard .pc-title{font-size:21px;font-weight:700;margin-bottom:8px}
  #progresscard .pc-hint{font-size:17px;color:#475569;margin-bottom:16px;line-height:1.5}
  #progresscard button.pc-btn{display:block;width:100%;min-height:48px;padding:12px;border-radius:12px;font-size:17px;font-weight:700;border:2px solid #2563eb;background:#2563eb;color:#fff;cursor:pointer;margin-bottom:10px}
  #progresscard button.pc-btn:active{background:#1d4ed8}
  #progresscard button.pc-btn.secondary{background:#fff;color:#2563eb}
  #progresscard button.pc-btn.secondary:active{background:#eff6ff}
  #progresscard textarea.pc-ta{display:block;width:100%;min-height:120px;font-size:16px;padding:10px;border-radius:10px;border:2px solid #cbd5e1;font-family:monospace;margin-bottom:10px;resize:vertical}
  #progresscard .pc-msg{font-size:17px;margin-bottom:10px;line-height:1.5}
  #progresscard .pc-msg.ok{color:#166534;font-weight:700}
  #progresscard .pc-msg.err{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const B2="hebrew-b2-quiz.html?g=";
const B1="hebrew-engineer.html?g=";

// Beginner decks (single link)
const START=[
  {file:"hebrew-test.html",ico:"🎯",t:"Проверка знаний",d:"64 вопроса · ваш уровень и что учить"},
  {file:"hebrew-test-idioms.html",ico:"💬",t:"Идиомы и сленг — тест",d:"32 фразы: бытовые, сленг, поговорки, образные"},
  {file:"hebrew-zero.html",ico:"א",t:"Алфавит и первые 50 слов",d:"22 буквы со звуком + базовые слова"},
  {file:"hebrew-everyday.html",ico:"🍎",t:"100 слов с картинками",d:"еда, тело, дом, животные, числа, цвета"},
];

// Everyday topics: A2 picture deck + matching B2 section
const TOPICS=[
  {ico:"🩺",t:"Здоровье и врач",d:"тело, болезни, аптека",cards:"hebrew-health.html",test:B2+encodeURIComponent("Здоровье и тело")},
  {ico:"🛒",t:"Магазин и еда",d:"продукты, ресторан, одежда",cards:"hebrew-shopping.html",test:B2+encodeURIComponent("Еда и магазин")},
  {ico:"🏠",t:"Дом и быт",d:"квартира, мебель, ремонт",cards:"hebrew-home.html",test:B2+encodeURIComponent("Дом и быт")},
  {ico:"🚌",t:"Город и транспорт",d:"транспорт, район, путешествия",cards:"hebrew-city.html",test:B2+encodeURIComponent("Город и транспорт")},
  {ico:"👪",t:"Люди и общение",d:"семья, эмоции, характер",cards:"hebrew-people.html",test:B2+encodeURIComponent("Семья и эмоции")},
];

// B2-only topics (no beginner picture deck) — single link to B2 section
const MORE=[
  {ico:"💼",t:"Деньги и работа",d:"банк, профессии, учреждения",file:B2+encodeURIComponent("Деньги и работа")},
  {ico:"🎓",t:"Школа и учёба",d:"дети, обучение",file:B2+encodeURIComponent("Школа и учёба")},
  {ico:"⚖️",t:"Право и безопасность",d:"документы, ситуации",file:B2+encodeURIComponent("Право и безопасность")},
  {ico:"💻",t:"Техника и СМИ",d:"телефон, компьютер, новости",file:B2+encodeURIComponent("Техника и СМИ")},
  {ico:"🏃",t:"Глаголы",d:"действия, повседневные глаголы",file:B2+encodeURIComponent("Глаголы")},
  {ico:"💬",t:"Фразы и идиомы",d:"выражения, сленг, поговорки",file:B2+encodeURIComponent("Фразы и идиомы")},
  {ico:"🔤",t:"Грамматика и абстракции",d:"наречия, числа, время, союзы",file:B2+encodeURIComponent("Грамматика и абстракции")},
];

// Engineering (B1) sections
const ENG=[
  {ico:"📐",t:"Стройка и техника",d:"стройка, геометрия, механика",file:B1+encodeURIComponent("Технический иврит")},
  {ico:"📄",t:"Документы и договоры",d:"договоры, акты",file:B1+encodeURIComponent("Документы и договоры")},
  {ico:"🔤",t:"Язык и грамматика (B1)",d:"фразы, глаголы, предлоги",file:B1+encodeURIComponent("Язык и грамматика")},
];

const app=document.getElementById('app');
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function groupTitle(t){app.appendChild(el('div','group-title',t))}
function deckRow(it){
  const a=document.createElement('a');a.className='deck';a.href=it.file;
  a.innerHTML='<div class="ico">'+it.ico+'</div><div class="body"><div class="t">'+it.t+'</div><div class="d">'+it.d+'</div></div><div class="arrow">›</div>';
  app.appendChild(a);
}
function topicCard(it){
  const card=el('div','topic');
  card.innerHTML='<div class="head"><div class="ico">'+it.ico+'</div><div><div class="t">'+it.t+'</div><div class="d">'+it.d+'</div></div></div>';
  const acts=el('div','acts');
  const c=document.createElement('a');c.className='act cards';c.href=it.cards;c.textContent='🖼 Картинки';
  const t=document.createElement('a');t.className='act test';t.href=it.test;t.textContent='✓ Тест B2';
  acts.appendChild(c);acts.appendChild(t);
  card.appendChild(acts);
  app.appendChild(card);
}

app.appendChild(el('h1',null,'Учим иврит'));
app.appendChild(el('div','sub','Выберите тему'));

// ── Voice check panel ──
// Returns true only if the native Android TTS bridge actually took the utterance.
function bridgeSpeak(text,lang,rate){
  var B=window.AndroidTTS;
  if(!B||typeof B.speak!=='function')return false;
  try{
    if(typeof B.isReady==='function'&&!B.isReady())return false;
    if(typeof B.hasLanguage==='function'&&!B.hasLanguage(lang))return false;
    var r=B.speak(text,lang,rate);
    return r!==false; // old APK returns undefined (void); ready+language already verified
  }catch(e){return false}
}
let heVoice=null;
function pickV(){if(!('speechSynthesis' in window))return;const a=speechSynthesis.getVoices()||[];heVoice=a.find(v=>/^he[-_]?IL/i.test(v.lang))||a.find(v=>/^iw[-_]?IL/i.test(v.lang))||a.find(v=>/^(he|iw)/i.test(v.lang))||null}
if('speechSynthesis' in window){pickV();speechSynthesis.onvoiceschanged=pickV;setTimeout(pickV,300);setTimeout(pickV,1500)}

function waitAndroidReady(timeoutMs){
  return new Promise(resolve=>{
    const B=window.AndroidTTS;
    const start=Date.now();
    (function poll(){
      let ready=false;
      try{ready=(typeof B.isReady==='function')?!!B.isReady():true}catch(e){ready=true}
      if(ready||Date.now()-start>=timeoutMs){resolve(ready);return}
      setTimeout(poll,300);
    })();
  });
}
function waitVoices(timeoutMs){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window)){resolve([]);return}
    let done=false;
    const finish=()=>{if(done)return;done=true;resolve(speechSynthesis.getVoices()||[])};
    const v=speechSynthesis.getVoices()||[];
    if(v.length){finish();return}
    speechSynthesis.onvoiceschanged=finish;
    setTimeout(finish,timeoutMs);
  });
}
async function detectVoices(){
  let he=false,ru=false;
  if(window.AndroidTTS){
    const B=window.AndroidTTS;
    await waitAndroidReady(4000);
    try{he=(typeof B.hasLanguage==='function')?!!B.hasLanguage('he'):true}catch(e){he=false}
    try{ru=(typeof B.hasLanguage==='function')?!!B.hasLanguage('ru'):true}catch(e){ru=false}
  }else{
    const voices=await waitVoices(1500);
    he=voices.some(v=>/^(he|iw)/i.test(v.lang));
    ru=voices.some(v=>/^ru/i.test(v.lang));
  }
  return {he,ru};
}
function testSound(){
  const text='שָׁלוֹם';
  if(bridgeSpeak(text,'he',0.8))return;
  if('speechSynthesis' in window){
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang='he-IL';
      if(heVoice)u.voice=heVoice;
      u.rate=0.8;u.pitch=1;u.volume=1;
      speechSynthesis.speak(u);
      return;
    }catch(e){}
  }
  try{const a=new Audio('audio/words/W01.mp3');a.play().catch(()=>{})}catch(e){}
}
const voiceBox=el('div',null,'');
voiceBox.id='voicecheck';
app.appendChild(voiceBox);
detectVoices().then(({he,ru})=>{
  voiceBox.innerHTML='';
  if(he){
    const wrap=el('div','vc-ok');
    wrap.innerHTML='<div class="line">🔊 Голос иврита: есть</div><div class="line">🔊 Голос русского: '+(ru?'есть':'нет')+'</div>';
    const btn=document.createElement('button');btn.className='vc-btn secondary';btn.textContent='Проверить звук';btn.addEventListener('click',testSound);
    wrap.appendChild(btn);
    voiceBox.appendChild(wrap);
  }else{
    const wrap=el('div','vc-warn');
    wrap.innerHTML='<div class="msg">🔊 Голос иврита не найден — без него слова не будут звучать</div>'+
      '<div class="steps">Как установить:<br>1. Настройки → Общие настройки → Язык и ввод → Преобразование текста в речь → Google → ⚙ → Установить голосовые данные → עברית (иврит)<br>2. Закройте и снова откройте приложение.</div>';
    const btn=document.createElement('button');btn.className='vc-btn';btn.textContent='Проверить звук';btn.addEventListener('click',testSound);
    wrap.appendChild(btn);
    if(window.AndroidTTS&&typeof window.AndroidTTS.openTtsSettings==='function'){
      const btn2=document.createElement('button');btn2.className='vc-btn secondary';btn2.textContent='Открыть настройки голоса';
      btn2.addEventListener('click',()=>{try{window.AndroidTTS.openTtsSettings()}catch(e){}});
      wrap.appendChild(btn2);
    }
    voiceBox.appendChild(wrap);
  }
});

// PWA install prompt
const installBtn=document.createElement('button');
installBtn.className='install-btn';
installBtn.textContent='📲 Установить как приложение';
app.appendChild(installBtn);
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;installBtn.style.display='none';deferredPrompt.prompt();deferredPrompt=null});
window.addEventListener('appinstalled',()=>{installBtn.style.display='none'});

groupTitle('Начало для новичков');
START.forEach(deckRow);

groupTitle('Повседневные темы');
TOPICS.forEach(topicCard);

groupTitle('Ещё темы (B2)');
MORE.forEach(deckRow);

groupTitle('Инженерный иврит (B1)');
ENG.forEach(deckRow);

// ── Progress save/restore (text code, no file download — WebView clipboard only) ──
const PROGRESS_KEY_RE = /^(hz-state|he100-state|he-block-|hq-prog|hq2-prog|he-test-state|he-test-idioms-state)/;

function pcGetKeys(){
  const keys=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&PROGRESS_KEY_RE.test(k))keys.push(k);
    }
  }catch(e){}
  return keys;
}
function pcB64Encode(str){return btoa(unescape(encodeURIComponent(str)))}
function pcB64Decode(str){return decodeURIComponent(escape(atob(str)))}

function pcBuildCode(){
  const keys=pcGetKeys();
  const d={};
  keys.forEach(k=>{
    try{
      const v=localStorage.getItem(k);
      if(v!==null)d[k]=v;
    }catch(e){}
  });
  const json=JSON.stringify({v:1,t:Date.now(),d:d});
  return {code:'HQ1:'+pcB64Encode(json),count:Object.keys(d).length};
}

// Throws on any invalid input; returns the parsed {v,t,d} object on success.
function pcParseCode(raw){
  const cleaned=(raw||'').replace(/\s+/g,'');
  if(cleaned.indexOf('HQ1:')!==0)throw new Error('bad prefix');
  const json=pcB64Decode(cleaned.slice(4));
  const obj=JSON.parse(json);
  if(obj.v!==1||typeof obj.d!=='object'||obj.d===null||Array.isArray(obj.d))throw new Error('bad shape');
  return obj;
}

function pcRestore(obj){
  let n=0;
  Object.keys(obj.d).forEach(k=>{
    if(PROGRESS_KEY_RE.test(k)){
      try{localStorage.setItem(k,obj.d[k]);n++}catch(e){}
    }
  });
  return n;
}

function buildProgressCard(){
  const card=el('div',null,'');
  card.id='progresscard';
  card.innerHTML=
    '<div class="pc-title">💾 Сохранить прогресс</div>'+
    '<div class="pc-hint">Перед переустановкой приложения сохраните код — потом вставьте его, и всё восстановится.</div>'+
    '<button type="button" class="pc-btn" id="pc-export-btn">Получить код прогресса</button>'+
    '<button type="button" class="pc-btn secondary" id="pc-import-btn">Восстановить из кода</button>'+
    '<div id="pc-export-area" style="display:none"></div>'+
    '<div id="pc-import-area" style="display:none"></div>';
  app.appendChild(card);

  const exportBtn=card.querySelector('#pc-export-btn');
  const exportArea=card.querySelector('#pc-export-area');
  exportBtn.addEventListener('click',()=>{
    let res;
    try{res=pcBuildCode()}catch(e){res={code:'',count:0}}
    exportArea.style.display='block';
    if(res.count===0){
      exportArea.innerHTML='<div class="pc-msg">Пока нечего сохранять — прогресса ещё нет.</div>';
      return;
    }
    exportArea.innerHTML=
      '<textarea class="pc-ta" id="progresscode" readonly></textarea>'+
      '<button type="button" class="pc-btn secondary" id="pc-copy-btn">📋 Скопировать</button>'+
      '<div class="pc-msg">Отправьте этот код себе в WhatsApp или сделайте скриншот. Записей: '+res.count+'</div>';
    const ta=exportArea.querySelector('#progresscode');
    ta.value=res.code;
    try{ta.focus();ta.select()}catch(e){}
    const copyBtn=exportArea.querySelector('#pc-copy-btn');
    const origLabel=copyBtn.textContent;
    copyBtn.addEventListener('click',()=>{
      const done=()=>{
        copyBtn.textContent='Скопировано ✓';
        setTimeout(()=>{copyBtn.textContent=origLabel},2000);
      };
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(res.code).then(done).catch(()=>{
          try{ta.focus();ta.select();document.execCommand('copy')}catch(e){}
          done();
        });
      }else{
        try{ta.focus();ta.select();document.execCommand('copy')}catch(e){}
        done();
      }
    });
  });

  const importBtn=card.querySelector('#pc-import-btn');
  const importArea=card.querySelector('#pc-import-area');
  importBtn.addEventListener('click',()=>{
    if(importArea.style.display==='block')return;
    importArea.style.display='block';
    importArea.innerHTML=
      '<textarea class="pc-ta" id="importcode" placeholder="Вставьте код, начинается с HQ1:"></textarea>'+
      '<button type="button" class="pc-btn" id="pc-restore-btn">Восстановить</button>'+
      '<div id="pc-import-msg"></div>';
    const restoreBtn=importArea.querySelector('#pc-restore-btn');
    const msgBox=importArea.querySelector('#pc-import-msg');
    restoreBtn.addEventListener('click',()=>{
      const ta=importArea.querySelector('#importcode');
      let obj;
      try{
        obj=pcParseCode(ta.value);
      }catch(e){
        msgBox.innerHTML='<div class="pc-msg err">Код не распознан. Проверьте, что скопирован полностью.</div>';
        return;
      }
      if(!confirm('Восстановить прогресс? Текущий прогресс на этом устройстве будет заменён.'))return;
      const n=pcRestore(obj);
      msgBox.innerHTML='<div class="pc-msg ok">Готово: восстановлено '+n+' записей</div>';
      setTimeout(()=>{location.reload()},1500);
    });
  });
}
buildProgressCard();

// ── URL-fragment import, e.g. for a future domain-migration redirect: #import=HQ1:... ──
(function pcHandleHashImport(){
  try{
    if(location.hash && location.hash.indexOf('#import=')===0){
      const raw=decodeURIComponent(location.hash.slice('#import='.length));
      let obj=null,valid=false;
      try{obj=pcParseCode(raw);valid=true}catch(e){valid=false}
      if(valid && confirm('Восстановить прогресс? Текущий прогресс на этом устройстве будет заменён.')){
        pcRestore(obj);
        try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
        setTimeout(()=>{location.reload()},1500);
        return;
      }
      try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    }
  }catch(e){
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e2){}
  }
})();

app.appendChild(el('div','foot',
  'Звук — голосом системы (иврит). Если его нет — в начале каждой темы есть подсказка, как установить.<br>'+
  'Иконки — <a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a>, CC BY-SA 4.0.<br>'+
  '<b>© Shimon Donen, 2026</b>'));
</script>
