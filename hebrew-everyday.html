  .act.yes:active{background:#bbf7d0}

/* ───────── Состояние ───────── */
let state={
  page:"menu",
  cat:"",
  dir:"ru-he",       // ru-he | he-ru
  mode:"cards",      // cards | quiz
  idx:0,
  order:[],
  reveal:false,
  pick:null,
  opts:[],
  rate:0.5,
  known:{},
};
try{const s=localStorage.getItem("he100-state");if(s){const p=JSON.parse(s);if(p.known)state.known=p.known;if(p.rate)state.rate=p.rate;if(p.dir)state.dir=p.dir;if(p.mode)state.mode=p.mode}}catch(e){}
const save=()=>{try{localStorage.setItem("he100-state",JSON.stringify({known:state.known,rate:state.rate,dir:state.dir,mode:state.mode}))}catch(e){}};

/* ───────── TTS + bundled MP3 ───────── */
let heVoice=null,ruVoice=null;
function pickV(){if(!('speechSynthesis' in window))return;const a=speechSynthesis.getVoices()||[];
  heVoice=a.find(v=>/^he[-_]?IL/i.test(v.lang))||a.find(v=>/^iw[-_]?IL/i.test(v.lang))||a.find(v=>/^(he|iw)/i.test(v.lang))||null;
  ruVoice=a.find(v=>/^ru[-_]?RU/i.test(v.lang))||a.find(v=>/^ru/i.test(v.lang))||null;
}
if('speechSynthesis' in window){pickV();speechSynthesis.onvoiceschanged=pickV;setTimeout(pickV,300);setTimeout(pickV,1500)}
const fbAudio=new Audio();fbAudio.preload='none';try{fbAudio.preservesPitch=true;fbAudio.mozPreservesPitch=true;fbAudio.webkitPreservesPitch=true}catch(e){}
function mp3Url(arrIdx,lang){if(arrIdx==null)return null;const n=String(arrIdx+1).padStart(3,'0');return 'audio/everyday/'+n+(lang==='ru'?'-ru':'')+'.mp3'}
function speakNative(text,lang,slow){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel()}catch(e){}
  setTimeout(()=>{pickV();const u=new SpeechSynthesisUtterance(text);u.lang=(lang==='ru')?'ru-RU':'he-IL';const v=(lang==='ru')?ruVoice:heVoice;if(v)u.voice=v;u.rate=slow?Math.max(0.3,state.rate-0.15):state.rate;u.pitch=1;u.volume=1;try{speechSynthesis.speak(u)}catch(e){}},60);
}
function speak(text,lang,slow,arrIdx){
  if(typeof lang==='boolean'){slow=lang;lang='he';arrIdx=undefined}
  if(!lang)lang='he';
  const url=mp3Url(arrIdx,lang);
  if(url){try{fbAudio.pause();fbAudio.currentTime=0}catch(e){}fbAudio.src=url;fbAudio.playbackRate=slow?0.7:1.0;const p=fbAudio.play();if(p&&p.catch)p.catch(()=>speakNative(text,lang,slow));return}
  speakNative(text,lang,slow);
}

/* ───────── Утилиты ───────── */
const sh=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]]}return b};
const $=id=>document.getElementById(id);
function h(tag,cls,inner,on){
  const el=document.createElement(tag);
  if(cls)el.className=cls;
  if(inner!=null)el.innerHTML=inner;
  if(on)el.addEventListener('click',on);
  return el;
}
function imgPath(arrIdx){return 'images/everyday/N'+String(arrIdx+1).padStart(3,'0')+'.png'}
function categoryList(){return [...new Set(WORDS.map(w=>w[4]))]}
function inCategory(cat){const r=[];WORDS.forEach((w,i)=>{if(w[4]===cat)r.push(i)});return r}
function knownInCat(cat){return inCategory(cat).filter(i=>state.known[WORDS[i][0]]).length}

const UA=navigator.userAgent||'';
const IS_ANDROID=/Android/i.test(UA);
const IS_IOS=/iPad|iPhone|iPod/.test(UA);

function buildOpts(){
  const arrIdx=state.order[state.idx];
  const correct=WORDS[arrIdx];
  const pool=inCategory(state.cat).filter(i=>i!==arrIdx);
  const distract=sh(pool).slice(0,3).map(i=>WORDS[i]);
  state.opts=sh([correct,...distract]);
}
function startSession(cat){
  state.cat=cat;
  state.order=sh(inCategory(cat));
  state.idx=0;state.reveal=false;state.pick=null;
  if(state.mode==='quiz')buildOpts();
  state.page='cards';
  render();
}
function advance(markKnown){
  const arrIdx=state.order[state.idx];
  const item=WORDS[arrIdx];
  if(markKnown){state.known[item[0]]=1;save()}
  state.idx++;state.reveal=false;state.pick=null;
  if(state.idx>=state.order.length){state.page='done';render();return}
  if(state.mode==='quiz')buildOpts();
  render();
}
function moveBy(d){
  state.idx+=d;
  if(state.idx<0)state.idx=0;
  state.reveal=false;state.pick=null;
  if(state.idx>=state.order.length){state.page='done';render();return}
  if(state.mode==='quiz')buildOpts();
  render();
}

/* ───────── Рендер ───────── */
function render(){
  const app=$('app');
  app.innerHTML='';
  if(state.page==='menu')return renderMenu(app);
  if(state.page==='done')return renderDone(app);
  return renderCard(app);
}

function renderMenu(app){
  const home=h('a','home-link','‹ Все темы');home.href='index.html';home.style.cssText='display:inline-block;color:#2563eb;font-size:16px;font-weight:600;text-decoration:none;margin-bottom:12px';app.appendChild(home);
  app.appendChild(h('h1','','Иврит — 100 слов'));
  app.appendChild(h('div','sub','с картинками, не спеша'));

  if('speechSynthesis' in window && !heVoice){
    let txt='Голос иврита в системе не найден — звука пока не будет. Чтобы включить: ';
    if(IS_ANDROID)txt+='«Настройки → Общие настройки → Язык и ввод → Преобразование текста в речь → Google → ⚙ → Установить голосовые данные → עברית». Затем перезапустите Chrome.';
    else if(IS_IOS)txt+='«Настройки → Универсальный доступ → Устный контент → Голоса → Иврит».';
    else txt+='«Параметры → Время и язык → Языки → Добавить язык → עברית (Hebrew), отметить «Преобразование текста в речь» → Установить. Затем перезапустить Chrome.';
    app.appendChild(h('div','notice',txt));
  }

  // Mode toggle
  app.appendChild(h('div','dir-label','Режим:'));
  const modeRow=h('div','dir-row');
  [['cards','Карточки'],['quiz','Проверка']].forEach(([v,lbl])=>{
    modeRow.appendChild(h('button','dir-btn'+(state.mode===v?' on':''),lbl,()=>{state.mode=v;save();render()}));
  });
  app.appendChild(modeRow);
  // Direction toggle
  app.appendChild(h('div','dir-label','В какую сторону:'));
  const dirRow=h('div','dir-row');
  [['ru-he','Русский → Иврит'],['he-ru','Иврит → Русский']].forEach(([v,lbl])=>{
    const b=h('button','dir-btn'+(state.dir===v?' on':''),lbl,()=>{state.dir=v;save();render()});
    dirRow.appendChild(b);
  });
  app.appendChild(dirRow);

  categoryList().forEach(cat=>{
    const total=inCategory(cat).length;
    const k=knownInCat(cat);
    const btn=h('button','menu-btn',
      '<div class="t">'+cat+'</div>'+
      '<div class="d">'+total+' слов</div>'+
      '<div class="p">Изучено: '+k+' / '+total+'</div>',
      ()=>startSession(cat));
    app.appendChild(btn);
  });

  const sr=h('div','speed-row','<span>Скорость голоса:</span>');
  const speeds=[["Медленно",0.4],["Помедленнее",0.5],["Обычно",0.7]];
  speeds.forEach(([lbl,v])=>{
    sr.appendChild(h('button','speed-btn'+(Math.abs(state.rate-v)<0.01?' on':''),lbl,()=>{state.rate=v;save();render()}));
  });
  app.appendChild(sr);

  app.appendChild(h('button','reset','Сбросить прогресс',()=>{
    if(confirm('Стереть весь выученный прогресс?')){state.known={};save();render()}
  }));

  app.appendChild(h('div','credit','Иконки — <a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a>, CC BY-SA 4.0'));
}

function renderTopBar(app){
  const bar=h('div','bar');
  bar.appendChild(h('button','back','← Меню',()=>{state.page='menu';render()}));
  const pgw=h('div','pgwrap');
  pgw.appendChild(h('div','pgnum',(state.idx+1)+' / '+state.order.length));
  const pgb=h('div','pgbar');
  pgb.innerHTML='<div style="width:'+((state.idx+1)/state.order.length*100)+'%"></div>';
  pgw.appendChild(pgb);
  bar.appendChild(pgw);
  app.appendChild(bar);
}

function renderCard(app){
  const arrIdx=state.order[state.idx];
  const item=WORDS[arrIdx];
  const he=item[0],tr=item[1],ru=item[2],hasImg=item[3],cat=item[4];

  renderTopBar(app);

  // Speed selector
  const sr=h('div','speed-row','<span>Скорость:</span>');
  const speeds=[["Медленно",0.4],["Средне",0.5],["Обычно",0.7]];
  speeds.forEach(([lbl,v])=>{
    sr.appendChild(h('button','speed-btn'+(Math.abs(state.rate-v)<0.01?' on':''),lbl,()=>{state.rate=v;save();render()}));
  });
  app.appendChild(sr);

  const card=h('div','card');
  card.appendChild(h('div','cat-label',cat));
  const heCls='he-big'+(he.length>6?' smaller':'');

  if(state.mode==='quiz'){
    // Проверка: картинку не показываем
    if(state.dir==='ru-he'){
      card.appendChild(h('div','qprompt','Выберите перевод на иврит'));
      card.appendChild(h('div','ru-big',ru));
    }else{
      card.appendChild(h('div','qprompt','Что это значит?'));
      card.appendChild(h('div',heCls,he));
      card.appendChild(h('div','tr',tr));
      const ar=h('div','audio-row');
      ar.appendChild(h('button','abtn primary','🔊 Послушать',()=>speak(he,'he',false,arrIdx)));
      card.appendChild(ar);
    }
    app.appendChild(card);
    const opts=h('div','opts');
    state.opts.forEach(o=>{
      let cls='opt'+(state.dir==='ru-he'?' he':'');
      if(state.pick){
        if(o===item)cls+=' ok';
        else if(o===state.pick)cls+=' bad';
      }
      const label=(state.dir==='ru-he')?o[0]:o[2];
      const b=h('button',cls,label,()=>{if(state.pick)return;state.pick=o;
        const oIdx=WORDS.indexOf(o);
        if(state.dir==='ru-he')speak(o[0],'he',false,oIdx);else speak(o[2],'ru',false,oIdx);
        render()});
      if(state.pick)b.setAttribute('disabled','');
      opts.appendChild(b);
    });
    app.appendChild(opts);
    if(state.pick){
      const correct=state.pick===item;
      app.appendChild(h('button','next',correct?'Верно! Дальше →':'Дальше →',()=>advance(correct)));
    }
  }else{
    if(hasImg){
      const img=h('img','img-card');
      img.src=imgPath(arrIdx);
      img.alt=ru;
      card.appendChild(img);
    }else{
      card.appendChild(h('div','no-img'));
    }
    if(state.dir==='ru-he'){
      card.appendChild(h('div','ru-big',ru));
      if(state.reveal){
        card.appendChild(h('div','divider'));
        card.appendChild(h('div',heCls,he));
        card.appendChild(h('div','tr',tr));
      }
    }else{
      card.appendChild(h('div',heCls,he));
      card.appendChild(h('div','tr',tr));
      if(state.reveal){
        card.appendChild(h('div','divider'));
        card.appendChild(h('div','ru-big',ru));
      }
    }
    const ar=h('div','audio-row');
    ar.appendChild(h('button','abtn primary','🔊 Послушать',()=>speak(he,'he',false,arrIdx)));
    ar.appendChild(h('button','abtn','🐢 Ещё медленнее',()=>speak(he,'he',true,arrIdx)));
    card.appendChild(ar);
    app.appendChild(card);
    if(!state.reveal){
      app.appendChild(h('button','act show','Показать ответ',()=>{state.reveal=true;render();setTimeout(()=>speak(he,'he',false,arrIdx),120)}));
    }else{
      const ac=h('div','actions');
      ac.appendChild(h('button','act no','Ещё не знаю',()=>advance(false)));
      ac.appendChild(h('button','act yes','Знаю',()=>advance(true)));
      app.appendChild(ac);
    }
  }

  // Navigation
  const nav=h('div','nav-row');
  const prev=h('button','nav-btn','← Назад',()=>moveBy(-1));
  if(state.idx===0)prev.setAttribute('disabled','');
  const mid=h('button','nav-btn mid','Меню',()=>{state.page='menu';render()});
  const next=h('button','nav-btn','Вперёд →',()=>moveBy(1));
  nav.appendChild(prev);
  nav.appendChild(mid);
  nav.appendChild(next);
  app.appendChild(nav);
}

function renderDone(app){
  app.appendChild(h('div','done',
    '<div class="t">Раздел пройден</div>'+
    '<div class="d">'+state.cat+': '+state.order.length+' слов.</div>'));
  app.appendChild(h('button','menu-btn',
    '<div class="t">Ещё раз</div><div class="d">пройти этот же раздел заново</div>',
    ()=>startSession(state.cat)));
  app.appendChild(h('button','menu-btn',
    '<div class="t">В меню</div><div class="d">выбрать другой раздел</div>',
    ()=>{state.page='menu';render()}));
}

render();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}))</script>
</body>
</html>
